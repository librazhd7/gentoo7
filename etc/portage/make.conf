#WARNING_FLAGS="-Werror=odr -Werror=lto-type-mismatch -Werror=strict-aliasing"
COMMON_FLAGS="-march=alderlake -O2 -pipe -fomit-frame-pointer -fno-semantic-interposition"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
RUSTFLAGS="-C target-cpu=alderlake"

# selecting testing branch as default for ebuilds
ACCEPT_KEYWORDS="~amd64"

# accepting any license that permits redistribution
ACCEPT_LICENSE="@BINARY-REDISTRIBUTABLE"

# automatically fetch binary packages and build from source if not available
#EMERGE_DEFAULT_OPTS="${EMERGE_DEFAULT_OPTS} --getbinpkg"

# effectively influencing portage behavior by enabling and/or disabling preferred features
# see: https://devmanual.gentoo.org/eclass-reference/make.conf/index.html
FEATURES="candy
          clean-logs
          fail-clean
          multilib-strict
          news
          nodoc
          noinfo
          parallel-fetch
          parallel-install
          preserve-libs
          unknown-features-warn
          unmerge-orphans
          -ebuild-locks"

# using swedish, american and canadian university distfiles mirrors with default as fallback
GENTOO_MIRRORS="https://ftp.lysator.liu.se/gentoo/
                https://mirrors.mit.edu/gentoo-distfiles/
                https://mirror.csclub.uwaterloo.ca/gentoo-distfiles/
                http://distfiles.gentoo.org"

# defines and limits how many parallel make jobs can be launched from portage
MAKEOPTS="-j12 -l13"

# install microcode data files
MICROCODE_SIGNATURES="-s 0x000906a3"

# minimizing portage impact on system responsiveness
PORTAGE_SCHEDULING_POLICY="idle"

# configure portage to determine how each package will be configured globally
# see: https://packages.gentoo.org/useflags/global
USE="acl
     acpi
     alsa
     bluetooth
     dbus
     egl
     gles2
     gstreamer
     hardened
     icu
     nls
     policykit
     pulseaudio
     screencast
     ssl
     systemd
     threads
     truetype
     udev
     udisks
     upower
     usb
     vaapi
     verify-sig
     vulkan
     wayland
     X
     zlib
     zsh-completion
     zstd
     -debug
     -elogind
     -examples
     -gpm
     -handbook"

# if precompiled (binary) gentoo distribution kernel is being used, append 'dist-kernel'
# see: https://wiki.gentoo.org/wiki/Distribution_Kernel

# if desired, append 'secureboot', 'modules-sign' for enabling uefi signature verifications and signing kernel modules
# see: https://wiki.gentoo.org/wiki/Secure_Boot

# this sets the language of build output to english.
# please keep this setting intact when reporting bugs.
LC_MESSAGES=C.utf8
